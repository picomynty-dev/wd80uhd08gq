<!doctype html>
<html lang="es" data-accent="orange" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <meta name="description" content="My Fit Plan: registra tus entrenamientos serie a serie, controla descansos y observa tu progreso.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Fit Plan">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=31">
  <title>My Fit Plan</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-nav="home" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span><strong>MY FIT</strong><small>PLAN · TRAIN SMART</small></span>
      </button>
      <div class="topbar-actions">
        <span class="version-badge" aria-label="Versión 3.1.2">v3.1.2</span>
        <button id="installButton" class="button button-secondary install-button" type="button" hidden>Instalar</button>
        <button id="profileShortcut" class="avatar-button" type="button" data-nav="profile" aria-label="Abrir perfil">MF</button>
      </div>
    </header>

    <button id="updateBanner" class="update-banner" type="button" hidden></button>
    <main id="app" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav premium-nav" aria-label="Navegación principal">
      <button type="button" data-nav="home" class="nav-item active"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7v9.1a1.2 1.2 0 0 1-1.2 1.2h-5.1v-6.2H9.3V21H4.2A1.2 1.2 0 0 1 3 19.8z"/></svg></span><small>Inicio</small></button>
      <button type="button" data-nav="plan" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4h12M6 10h12M6 16h8"/><circle cx="4" cy="4" r="1"/><circle cx="4" cy="10" r="1"/><circle cx="4" cy="16" r="1"/></svg></span><small>Plan</small></button>
      <button type="button" data-nav="workout" class="nav-item nav-train"><span class="nav-icon train-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 7v10M16 7v10M5 9v6M19 9v6M8 12h8"/></svg></span><small>Entrenar</small></button>
      <button type="button" data-nav="library" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span><small>Ejercicios</small></button>
      <button type="button" data-nav="profile" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span><small>Perfil</small></button>
    </nav>
  </div>

  <aside id="restTimerDock" class="rest-timer-dock" aria-live="polite" hidden></aside>
  <script>
    window.__mfpBooted = false;
    window.addEventListener('DOMContentLoaded', () => {
      if (window.location.protocol === 'file:') {
        const app = document.querySelector('#app');
        const nav = document.querySelector('.bottom-nav');
        if (nav) nav.hidden = true;
        if (app) app.innerHTML = `
          <section class="page boot-help">
            <div class="hero">
              <p class="eyebrow">My Fit Plan 3.1</p>
              <h1>Abre la aplicación desde su enlace web</h1>
              <p>Este archivo no puede ejecutarse correctamente al abrir <strong>index.html</strong> directamente. Los módulos de la aplicación necesitan GitHub Pages o un servidor local.</p>
              <p class="notice">En el ordenador, abre la misma dirección de GitHub Pages que utilizas en el iPhone. No abras el archivo desde la carpeta.</p>
            </div>
          </section>`;
      }
    });
    window.setTimeout(() => {
      if (window.__mfpBooted || window.location.protocol === 'file:') return;
      const app = document.querySelector('#app');
      if (app && !app.innerHTML.trim()) {
        app.innerHTML = `
          <section class="page boot-help">
            <div class="hero">
              <p class="eyebrow">Error de carga</p>
              <h1>No se ha podido iniciar My Fit Plan</h1>
              <p>Recarga la página. Si continúa igual, comprueba que la carpeta <strong>js</strong> está subida completa junto a <strong>index.html</strong>.</p>
            </div>
          </section>`;
      }
    }, 3500);
  </script>
  <script type="module" src="./js/app.js?v=31"></script>
</body>
</html>
