<!doctype html>
<html lang="es" data-accent="orange" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b12">
  <meta name="description" content="My Fit Plan: entrenamiento inteligente, rutinas, progresión y seguimiento personal.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Fit Plan">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <script>
    (() => {
      const root = document.documentElement;
      const positive = (value) => Number.isFinite(Number(value)) && Number(value) > 0;
      const sync = () => {
        const viewportWidth = [
          window.innerWidth,
          window.visualViewport?.width,
          document.documentElement.clientWidth
        ].filter(positive).map(Number);
        const width = viewportWidth.length ? Math.min(...viewportWidth) : 1024;
        const height = Number(window.visualViewport?.height || window.innerHeight || 768);
        const screenShortSide = Math.min(
          Number(window.screen?.width || width),
          Number(window.screen?.height || height)
        );
        const touch = Number(navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
        const phone = touch && screenShortSide <= 600;
        const mode = phone || width <= 820
          ? 'mobile'
          : width <= 1180
            ? 'compact'
            : 'desktop';

        root.dataset.hudMode = mode;
        root.dataset.hudOrientation = width > height ? 'landscape' : 'portrait';
        root.style.setProperty('--mfp-viewport-width', `${Math.round(width)}px`);
        root.style.setProperty('--mfp-viewport-height', `${Math.round(height)}px`);
      };
      window.__mfpSyncHudMode = sync;
      sync();
    })();
  </script>
  <link rel="stylesheet" href="./styles.css?v=401">
  <title>My Fit Plan</title>
</head>
<body>
  <div class="hud-background" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="app-shell hud-shell">
    <aside id="desktopRail" class="desktop-rail" aria-label="Navegación principal de escritorio">
      <button class="rail-brand" type="button" data-nav="home" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span><strong>MY FIT</strong><small>PLAN</small></span>
      </button>
      <nav class="rail-nav">
        <button type="button" data-nav="home" class="nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7v9.1A1.2 1.2 0 0 1 19.8 21h-5.1v-6.2H9.3V21H4.2A1.2 1.2 0 0 1 3 19.8z"/></svg></span><span><strong>Inicio</strong><small>Resumen</small></span></button>
        <button type="button" data-nav="plan" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 4h12M6 10h12M6 16h8"/><circle cx="4" cy="4" r="1"/><circle cx="4" cy="10" r="1"/><circle cx="4" cy="16" r="1"/></svg></span><span><strong>Plan</strong><small>Rutinas</small></span></button>
        <button type="button" data-nav="workout" class="nav-item rail-train"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M8 7v10M16 7v10M5 9v6M19 9v6M8 12h8"/></svg></span><span><strong>Entrenar</strong><small>Sesión</small></span></button>
        <button type="button" data-nav="library" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span><span><strong>Ejercicios</strong><small>Biblioteca</small></span></button>
        <button type="button" data-nav="profile" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span><span><strong>Perfil</strong><small>Progreso</small></span></button>
      </nav>
      <div class="rail-footer">
        <button class="rail-control" type="button" data-action="hud-control"><span><svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg></span><div><strong>Centro de control</strong><small id="railHealthText">Sistema operativo</small></div></button>
        <div class="rail-version"><span class="status-dot"></span><span>v4.0.1 · Cloud Sync UX</span></div>
      </div>
    </aside>

    <section class="app-stage">
      <header class="topbar hud-topbar">
        <button class="mobile-brand" type="button" data-nav="home" aria-label="Ir al inicio">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span><strong>MY FIT</strong><small>PLAN</small></span>
        </button>
        <div class="hud-context">
          <small id="hudEyebrow">MY FIT PLAN · CONTROL</small>
          <strong id="hudTitle">Panel de control</strong>
          <span id="hudSubtitle">Resumen de entrenamiento y progreso</span>
        </div>
        <div class="topbar-actions">
          <span id="networkStatus" class="network-status is-online"><span class="network-dot"></span><span class="network-label">Online</span></span>
          <span class="version-badge" aria-label="Versión 4.0.1">v4.0.1</span>
          <button id="installButton" class="button button-secondary install-button" type="button" hidden>Instalar</button>
          <button id="hudControlButton" class="hud-control-button" type="button" data-action="hud-control" aria-label="Abrir centro de control"><svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg></button>
          <button id="profileShortcut" class="avatar-button" type="button" data-nav="profile" aria-label="Abrir perfil">MF</button>
        </div>
      </header>

      <button id="activeSessionBar" class="active-session-bar" type="button" data-nav="workout" hidden></button>
      <button id="updateBanner" class="update-banner" type="button" hidden></button>
      <button id="hudErrorBanner" class="hud-error-banner" type="button" data-action="hud-control" hidden></button>
      <main id="app" tabindex="-1" aria-live="polite"></main>
    </section>

    <nav id="mobileDock" class="bottom-nav premium-nav" aria-label="Navegación principal">
      <button type="button" data-nav="home" aria-label="Inicio" class="nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7v9.1A1.2 1.2 0 0 1 19.8 21h-5.1v-6.2H9.3V21H4.2A1.2 1.2 0 0 1 3 19.8z"/></svg></span><small>Inicio</small></button>
      <button type="button" data-nav="plan" aria-label="Plan" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 4h12M6 10h12M6 16h8"/><circle cx="4" cy="4" r="1"/><circle cx="4" cy="10" r="1"/><circle cx="4" cy="16" r="1"/></svg></span><small>Plan</small></button>
      <button type="button" data-nav="workout" aria-label="Entrenar" class="nav-item nav-train"><span class="nav-train-orbit"></span><span class="nav-icon train-icon"><svg viewBox="0 0 24 24"><path d="M8 7v10M16 7v10M5 9v6M19 9v6M8 12h8"/></svg></span><small>Entrenar</small></button>
      <button type="button" data-nav="library" aria-label="Ejercicios" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span><small>Ejercicios</small></button>
      <button type="button" data-nav="profile" aria-label="Perfil" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span><small>Perfil</small></button>
    </nav>
  </div>

  <aside id="restTimerDock" class="rest-timer-dock" aria-live="polite" hidden></aside>
  <script>
    window.__mfpBooted = false;
    window.addEventListener('DOMContentLoaded', () => {
      if (window.location.protocol === 'file:') {
        const app = document.querySelector('#app');
        document.querySelectorAll('.bottom-nav,.desktop-rail').forEach((node) => node.hidden = true);
        if (app) app.innerHTML = `<section class="page boot-help"><div class="hero"><p class="eyebrow">My Fit Plan 4.0</p><h1>Abre la aplicación desde su enlace web</h1><p>Los módulos necesitan GitHub Pages o un servidor local. No abras <strong>index.html</strong> directamente desde una carpeta.</p></div></section>`;
      }
    });
    window.setTimeout(() => {
      if (window.__mfpBooted || window.location.protocol === 'file:') return;
      const app = document.querySelector('#app');
      if (app && !app.innerHTML.trim()) app.innerHTML = `<section class="page boot-help"><div class="hero"><p class="eyebrow">Recuperación</p><h1>No se ha podido iniciar My Fit Plan</h1><p>Recarga la página. Si continúa igual, comprueba que la carpeta <strong>js</strong> está subida completa.</p><button class="button button-primary" type="button" onclick="location.reload()">Recargar</button></div></section>`;
    }, 4000);
  </script>
  <script>
    (() => {
      const marker = 'mfp-clean-runtime-version';
      try {
        if (localStorage.getItem(marker) === '401') return;
        localStorage.setItem(marker, '401');
      } catch {
        if (window.location.search.includes('fresh=')) return;
      }
      const appBase = new URL('./', window.location.href).pathname;
      Promise.all([
        'caches' in window
          ? caches.keys().then((keys) => Promise.all(keys.filter((key) => key.startsWith('my-fit-plan-')).map((key) => caches.delete(key))))
          : Promise.resolve(),
        'serviceWorker' in navigator
          ? navigator.serviceWorker.getRegistrations().then((items) => Promise.all(items
              .filter((item) => {
                try { return new URL(item.scope).pathname.startsWith(appBase); }
                catch { return false; }
              })
              .map((item) => item.unregister())))
          : Promise.resolve()
      ]).then(() => {
        const url = new URL(window.location.href);
        url.searchParams.set('v', '401');
        url.searchParams.set('fresh', Date.now().toString());
        window.location.replace(url.toString());
      }).catch(() => {});
    })();
  </script>
  <script type="module" src="./js/app.js?v=401"></script>
</body>
</html>
