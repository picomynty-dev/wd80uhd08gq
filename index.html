<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f97316">
  <meta name="description" content="My Fit Plan: tu primera rutina de gimnasio, paso a paso.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>My Fit Plan</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-nav="home" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span><strong>MY FIT</strong><small>PLAN</small></span>
      </button>
      <button id="installButton" class="button button-secondary install-button" type="button" hidden>Instalar</button>
    </header>

    <main id="app" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button type="button" data-nav="home" class="nav-item active">
        <span aria-hidden="true">⌂</span><small>Inicio</small>
      </button>
      <button type="button" data-nav="plan" class="nav-item">
        <span aria-hidden="true">▤</span><small>Mi plan</small>
      </button>
      <button type="button" data-nav="workout" class="nav-item">
        <span aria-hidden="true">▶</span><small>Entrenar</small>
      </button>
      <button type="button" data-nav="progress" class="nav-item">
        <span aria-hidden="true">↗</span><small>Progreso</small>
      </button>
    </nav>
  </div>

  <template id="toastTemplate">
    <div class="toast" role="status"></div>
  </template>

  <script src="./app.js" defer></script>
</body>
</html>
