<!doctype html>
<html lang="es" data-accent="orange" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f97316">
  <meta name="description" content="My Fit Plan: registra tus entrenamientos serie a serie, controla descansos y observa tu progreso.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Fit Plan">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>My Fit Plan</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-nav="home" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span><strong>MY FIT</strong><small>PLAN</small></span>
      </button>
      <div class="topbar-actions">
        <span class="version-badge" aria-label="Versión 2.1">v2.1</span>
        <button id="installButton" class="button button-secondary install-button" type="button" hidden>Instalar</button>
        <button id="profileShortcut" class="avatar-button" type="button" data-nav="profile" aria-label="Abrir perfil">MF</button>
      </div>
    </header>

    <button id="updateBanner" class="update-banner" type="button" hidden></button>
    <main id="app" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button type="button" data-nav="home" class="nav-item active"><span aria-hidden="true">⌂</span><small>Inicio</small></button>
      <button type="button" data-nav="plan" class="nav-item"><span aria-hidden="true">▤</span><small>Plan</small></button>
      <button type="button" data-nav="workout" class="nav-item nav-train"><span aria-hidden="true">▶</span><small>Entrenar</small></button>
      <button type="button" data-nav="library" class="nav-item"><span aria-hidden="true">⌕</span><small>Ejercicios</small></button>
      <button type="button" data-nav="profile" class="nav-item"><span aria-hidden="true">●</span><small>Perfil</small></button>
    </nav>
  </div>

  <aside id="restTimerDock" class="rest-timer-dock" aria-live="polite" hidden></aside>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
